<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ロゴ確認（正本画像）</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; background: #f4f4f4; color: #111; }
    h1 { font-size: 1.1rem; }
    .row { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-end; }
    figure { margin: 0; background: #fff; padding: 1rem; border-radius: 0.5rem; text-align: center; }
    figcaption { margin-top: 0.5rem; font-size: 0.85rem; }
    img { max-width: 280px; width: 100%; height: auto; display: block; margin: 0 auto; }
    .sm img { max-width: 64px; }
  </style>
</head>
<body>
  <h1>ロゴ確認（共有正本をそのまま使用）</h1>
  <div class="row">
    <figure>
      <img src="logo-color.png" alt="正本フル" width="280">
      <figcaption>logo-color.png（表示の正）</figcaption>
    </figure>
    <figure>
      <img src="mark-only.png" alt="マーク" width="220">
      <figcaption>mark-only.png</figcaption>
    </figure>
    <figure class="sm">
      <img src="mark-favicon.png" alt="ファビコン" width="64" height="64">
      <figcaption>mark-favicon.png</figcaption>
    </figure>
  </div>
</body>
</html>
