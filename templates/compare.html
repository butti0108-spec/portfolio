<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>見比べ | 1万円プラン | 増渕 敦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="compare.css">
</head>
<body>
  <div class="compare">
    <header class="compare-bar">
      <p class="compare-title">見比べ</p>
      <p class="compare-hint">左がこのサイト。右はまず見本の枠。番号を見たら「記入用」に切り替えて書いてください。</p>
      <nav aria-label="見比べの案内">
        <a href="../index.html#pricing">料金へ戻る</a>
      </nav>
    </header>
    <div class="compare-panes">
      <section class="compare-pane" aria-labelledby="pane-site">
        <div class="compare-pane-head">
          <strong id="pane-site">左：このサイト</strong>
        </div>
        <iframe title="このサイト" src="../index.html"></iframe>
      </section>
      <section class="compare-pane" aria-labelledby="pane-form">
        <div class="compare-pane-head">
          <strong id="pane-form">右：見本の枠</strong>
          <button type="button" id="btn-sample" aria-pressed="true">見本の枠</button>
          <button type="button" id="btn-blank" aria-pressed="false">記入用</button>
        </div>
        <iframe id="form-frame" title="見本の枠" src="fill-in-sample.html"></iframe>
      </section>
    </div>
  </div>
  <script>
    (function () {
      var frame = document.getElementById("form-frame");
      var blank = document.getElementById("btn-blank");
      var sample = document.getElementById("btn-sample");

      var label = document.getElementById("pane-form");

      function show(src, title, isBlank) {
        frame.src = src;
        frame.title = title;
        label.textContent = "右：" + title;
        blank.setAttribute("aria-pressed", isBlank ? "true" : "false");
        sample.setAttribute("aria-pressed", isBlank ? "false" : "true");
      }

      blank.addEventListener("click", function () {
        show("fill-in.html", "記入用", true);
      });
      sample.addEventListener("click", function () {
        show("fill-in-sample.html", "見本の枠", false);
      });
    })();
  </script>
</body>
</html>
